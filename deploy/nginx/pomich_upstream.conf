# Shared upstream for pomich.help (http context — /etc/nginx/conf.d/).
upstream pomich_app {
    server 127.0.0.1:8000;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' "";
}

# Anonymous diagnostic intake: protect logs from request floods.
limit_req_zone $binary_remote_addr zone=pomich_vitals:10m rate=30r/s;
# Slow repeated password/bootstrap-token guesses without constraining order traffic.
limit_req_zone $binary_remote_addr zone=pomich_login:10m rate=10r/m;
