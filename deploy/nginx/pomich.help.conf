# POMICH public edge — reproducible from Git (apply via deploy.py / server_ops).
# Requires: /etc/nginx/conf.d/pomich_upstream.conf (upstream + Connection map).
# Static assets are published to /var/www/pomich/dist after each deploy (docker cp).

server {
    listen 80;
    listen [::]:80;
    server_name pomich.help www.pomich.help;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pomich.help www.pomich.help;

    ssl_certificate /etc/letsencrypt/live/pomich.help/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pomich.help/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Edge compression — assets no longer traverse Python GZipMiddleware.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/woff2;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;

    error_page 502 503 504 = @pomich_retry;

    location @pomich_retry {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 2 always;
        root /var/www/pomich;
        try_files /retry.html =502;
    }

    # Hashed Vite JS/CSS — nginx sendfile + long cache (biggest TTFB win).
    location ^~ /assets/ {
        alias /var/www/pomich/dist/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location ^~ /maps/ {
        alias /var/www/pomich/dist/maps/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location ^~ /geo/ {
        alias /var/www/pomich/dist/geo/;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /favicon.ico {
        alias /var/www/pomich/dist/favicon.ico;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        try_files "" @pomich_app;
    }

    location = /favicon-32.png {
        alias /var/www/pomich/dist/favicon-32.png;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        try_files "" @pomich_app;
    }

    location = /apple-touch-icon.png {
        alias /var/www/pomich/dist/apple-touch-icon.png;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        try_files "" @pomich_app;
    }

    location = /icon-192.png {
        alias /var/www/pomich/dist/icon-192.png;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        try_files "" @pomich_app;
    }

    location = /icon-512.png {
        alias /var/www/pomich/dist/icon-512.png;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        try_files "" @pomich_app;
    }

    location = /og-cover.jpg {
        alias /var/www/pomich/dist/og-cover.jpg;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        try_files "" @pomich_app;
    }

    location = /manifest.webmanifest {
        alias /var/www/pomich/dist/manifest.webmanifest;
        default_type application/manifest+json;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        try_files "" @pomich_app;
    }

    # Liveness — short timeouts, no access log noise.
    location = /api/health {
        proxy_pass http://pomich_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # Internal ops endpoints — localhost / private network only.
    location ^~ /internal/ {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://pomich_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # Realtime streams — never buffer.
    location ^~ /api/events/ {
        proxy_pass http://pomich_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/ws/ {
        proxy_pass http://pomich_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location @pomich_app {
        proxy_pass http://pomich_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 25m;
    }

    # SPA + API + WS — proxied (HTML stays no-cache via app).
    location / {
        proxy_pass http://pomich_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Buffer HTML/API JSON; streaming still uses Upgrade for WS/SSE.
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        client_max_body_size 25m;
    }
}
