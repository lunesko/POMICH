    <!-- Load Telegram WebApp SDK only inside Telegram (saves a request on web landing). -->
    <script>
      (function () {
        var ua = navigator.userAgent || ""
        var search = location.search || ""
        var hash = location.hash || ""
        var inTg =
          /Telegram/i.test(ua) ||
          /tgWebApp/i.test(search) ||
          /tgWebApp/i.test(hash) ||
          !!(window.Telegram && window.Telegram.WebApp)
        if (!inTg) {
          window.__pomichTelegramReady = Promise.resolve()
          return
        }
        window.__pomichTelegramReady = new Promise(function (resolve) {
          var settled = false
          var finish = function () {
            if (settled) return
            settled = true
            resolve()
          }
          var s = document.createElement("script")
          s.src = "https://telegram.org/js/telegram-web-app.js"
          s.async = false
          s.onload = finish
          s.onerror = finish
          document.head.appendChild(s)
          // Do not leave the application blank if Telegram CDN is unavailable.
          window.setTimeout(finish, 4000)
        })
      })()
    </script>

  <body>
    <!-- figma:body-start -->
    <noscript>
      <main style="font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #0f172a;">
        <h1>POMICH — допомога на дорозі</h1>
        <p>Викликайте евакуатор, запуск АКБ, допомогу з колесом або пальним поруч із вами в Ужгороді та Україні.</p>

        </ul>
        <p>Увімкніть JavaScript або відкрийте Telegram-бота <a href="https://t.me/pomich_ua_bot">@pomich_ua_bot</a>.</p>
      </main>
    </noscript>
    <div id="root">
      <div
        id="pomich-boot"
        style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;background:#E2E9E6;color:#1A2332;text-align:center;box-sizing:border-box;"
      >
        <div style="max-width:22rem;">
          <div style="font-weight:900;font-size:1.15rem;letter-spacing:0.04em;">POMICH</div>
          <p id="pomich-boot-msg" style="margin:12px 0 0;font-weight:700;line-height:1.45;opacity:0.85;">Завантаження…</p>
          <button
            id="pomich-boot-reload"
            type="button"
            style="display:none;margin-top:16px;min-height:44px;width:100%;border:none;border-radius:12px;background:linear-gradient(135deg,#16A36A 0%,#2F80ED 100%);color:#fff;font-weight:900;font-family:inherit;cursor:pointer;"
          >
            Оновити
          </button>
          <p id="pomich-boot-hint" style="display:none;margin:14px 0 0;font-size:0.85rem;line-height:1.4;opacity:0.75;font-weight:600;">
            Якщо кнопка не допомагає — закрийте Mini App хрестиком і відкрийте знову з бота.
          </p>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var KEY = "pomich-boot-reload"
        var msg = document.getElementById("pomich-boot-msg")
        var btn = document.getElementById("pomich-boot-reload")
        var hint = document.getElementById("pomich-boot-hint")
        var reloadStarted = false
        var lastNext = ""

        function alreadyBusted() {
          try {
            return new URL(location.href).searchParams.has("_pomich")
          } catch (e) {
            return /[?&]_pomich=/.test(location.search || "")
          }
        }

        function buildNextUrl() {
          return location.origin + "/?_pomich=" + Date.now() + "&_clear=1"
        }

        function tryBrowserNavigate(next) {
          // Telegram WebView often ignores one of these; try several.
          try {
            location.replace(next)
          } catch (e1) {}
          try {
            location.assign(next)
          } catch (e2) {}
          try {
            location.href = next
          } catch (e3) {}
          try {
            var a = document.createElement("a")
            a.href = next
            a.rel = "noopener"
            a.style.display = "none"
            document.body.appendChild(a)
            a.click()
          } catch (e4) {}
        }

        function tryTelegramOpen(next, openBot) {
          try {
            var tg = window.Telegram && window.Telegram.WebApp
            if (!tg) return
            if (typeof tg.openLink === "function") {
              try {
                tg.openLink(next, { try_instant_view: false })
              } catch (e1) {}
            }
            if (openBot && typeof tg.openTelegramLink === "function") {
              // Last resort: bounce through the bot so Mini App cold-starts.
              try {
                tg.openTelegramLink("https://t.me/pomich_ua_bot")
              } catch (e2) {}
            }
          } catch (e3) {}
        }

        function stillOnBoot() {
          return !!document.getElementById("pomich-boot")
        }

        function showExternalFallback(next) {
          reloadStarted = false
          if (msg) {
            msg.textContent =
              "Mini App не перезавантажується. Відкрийте в браузері або закрийте хрестиком і зайдіть з бота знову."
          }
          if (hint) hint.style.display = "block"
          if (!btn) return
          btn.disabled = false
          btn.removeAttribute("aria-busy")
          btn.textContent = "Відкрити в браузері"
          var openExternal = function (ev) {
            try {
              if (ev && ev.preventDefault) ev.preventDefault()
            } catch (e) {}
            var target = next || lastNext || buildNextUrl()
            try {
              window.open(target, "_blank")
            } catch (e2) {}
            tryTelegramOpen(target, true)
          }
          btn.onclick = openExternal
          btn.ontouchend = openExternal
        }

        function hardNavigate(attempt) {
          var n = typeof attempt === "number" ? attempt : 0
          var next = buildNextUrl()
          lastNext = next
          tryBrowserNavigate(next)
          // After first in-webview attempt fails, escape via Telegram openLink.
          if (n >= 1) tryTelegramOpen(next, n >= 3)
          if (n >= 3) {
            showExternalFallback(next)
            return
          }
          window.setTimeout(function () {
            if (!stillOnBoot()) return
            hardNavigate(n + 1)
          }, n === 0 ? 400 : 900)
        }

        function clearCachesBestEffort() {
          try {
            if (window.caches && caches.keys) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) {
                  try {
                    caches.delete(k)
                  } catch (e) {}
                })
              })
            }
          } catch (e) {}
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (reg) {
                  try {
                    reg.unregister()
                  } catch (e) {}
                })
              })
            }
          } catch (e) {}
        }

        function clearAndReload() {
          if (reloadStarted) return
          reloadStarted = true
          if (btn) {
            btn.disabled = true
            btn.setAttribute("aria-busy", "true")
            btn.textContent = "Оновлюємо…"
          }
          if (msg) msg.textContent = "Очищаємо кеш і перезавантажуємо…"
          try {
            sessionStorage.setItem(KEY, "1")
          } catch (e) {}
          clearCachesBestEffort()
          // Navigate immediately — do not wait on cache/SW promises (they hang in TG).
          hardNavigate(0)
        }

        function showReload(reason, auto) {
          if (msg) msg.textContent = reason || "Не вдалося завантажити. Натисніть «Оновити»."
          if (btn) {
            btn.style.display = "block"
            btn.disabled = false
            btn.textContent = "Оновити"
          }
          if (hint) hint.style.display = "block"
          // Never auto-loop: if we already cache-busted once, wait for a tap.
          if (!auto || alreadyBusted()) return
          var already = false
          try {
            already = sessionStorage.getItem(KEY) === "1"
          } catch (e) {}
          if (!already) clearAndReload()
        }

        function isAppAssetFailure(target) {
          if (!target) return false
          var src = String(target.src || target.href || "")
          if (!src) return false
          // Only recover from our hashed Vite modules/CSS — not fonts, icons, or telegram.org.
          try {
            var u = new URL(src, location.href)
            if (u.origin !== location.origin) return false
            return /^\/assets\/.+\.(js|css)$/.test(u.pathname)
          } catch (e) {
            return /\/assets\/.+\.(js|css)(\?|$)/.test(src)
          }
        }

        function onReloadTap(ev) {
          try {
            if (ev && ev.preventDefault) ev.preventDefault()
          } catch (e) {}
          try {
            if (ev && ev.stopPropagation) ev.stopPropagation()
          } catch (e2) {}
          clearAndReload()
        }

        if (btn) {
          // Inline + multiple events: TG WebView sometimes drops addEventListener clicks.
          btn.onclick = onReloadTap
          btn.ontouchend = onReloadTap
          btn.addEventListener("click", onReloadTap, false)
          btn.addEventListener("pointerup", onReloadTap, false)
          btn.addEventListener(
            "touchend",
            onReloadTap,
            { passive: false },
          )
        }

        window.addEventListener(
          "error",
          function (ev) {
            var t = ev && ev.target
            if (!t || (t.tagName !== "SCRIPT" && t.tagName !== "LINK")) return
            if (!isAppAssetFailure(t)) return
            showReload("Після оновлення залишився старий кеш.", true)
          },
          true,
        )
        window.addEventListener("unhandledrejection", function (ev) {
          var reason = ev && ev.reason
          var text = (reason && (reason.message || String(reason))) || ""
          if (/Failed to fetch dynamically imported module|Loading chunk|Importing a module script failed/i.test(text)) {
            showReload("Після оновлення залишився старий кеш.", true)
          }
        })
        window.setTimeout(function () {
          var root = document.getElementById("root")
          if (!root) return
          if (!document.getElementById("pomich-boot")) return
          if (root.childElementCount > 1) return
          // Slow boot — offer a button, but do not auto-reload forever.
          showReload("Довге завантаження. Натисніть «Оновити».", false)
        }, 12000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
