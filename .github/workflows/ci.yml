name: POMICH CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Run backend tests
        run: python -m pytest

      - name: Compile ops scripts
        run: python -m py_compile scripts/ops/backup_postgres.py scripts/ops/restore_postgres.py scripts/ops/telegram_set_webhooks.py

      - name: Run frontend tests
        run: npm test

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Validate e2e release gate harness
        run: npm run test:e2e

  postgis-runtime:
    name: PostGIS runtime smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: pomich
          POSTGRES_USER: pomich
          POSTGRES_PASSWORD: pomich
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pomich -d pomich"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run PostGIS dispatch smoke
        env:
          POMICH_STORAGE_BACKEND: sql
          DATABASE_URL: postgresql+psycopg://pomich:pomich@127.0.0.1:5432/pomich
        run: python scripts/postgis_smoke.py
