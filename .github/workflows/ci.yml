name: POMICH CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Check production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Run backend tests
        run: python -m pytest

      - name: Run frontend tests
        run: npm test

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UX and accessibility checks
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results/playwright
          retention-days: 7

  postgis-runtime:
    name: PostGIS runtime smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: pomich
          POSTGRES_USER: pomich
          POSTGRES_PASSWORD: pomich
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pomich -d pomich"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run PostGIS dispatch smoke
        env:
          POMICH_STORAGE_BACKEND: sql
          DATABASE_URL: postgresql+psycopg://pomich:pomich@127.0.0.1:5432/pomich
        run: python scripts/postgis_smoke.py

      - name: Verify PostGIS backup restore round trip
        run: |
          bash -n scripts/ops/backup_postgres.sh scripts/ops/verify_postgres_backup.sh
          docker exec "${{ job.services.postgres.id }}" sh -ec \
            'export PGPASSWORD="$POSTGRES_PASSWORD"; exec pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc --no-owner --no-acl' \
            > "$RUNNER_TEMP/pomich-ci.dump"
          (cd "$RUNNER_TEMP" && sha256sum pomich-ci.dump > pomich-ci.dump.sha256)
          bash scripts/ops/verify_postgres_backup.sh "$RUNNER_TEMP/pomich-ci.dump"

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, postgis-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: pomich-production
      cancel-in-progress: false

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Install password SSH fallback
        env:
          POMICH_SSH_PRIVATE_KEY: ${{ secrets.POMICH_SSH_PRIVATE_KEY }}
          POMICH_SSH_PASSWORD: ${{ secrets.POMICH_SSH_PASSWORD }}
        run: |
          if [[ -z "$POMICH_SSH_PRIVATE_KEY" && -n "$POMICH_SSH_PASSWORD" ]]; then
            sudo apt-get update
            sudo apt-get install -y sshpass
          fi

      - name: Deploy tested commit
        env:
          POMICH_SSH_HOST: ${{ secrets.POMICH_SSH_HOST }}
          POMICH_SSH_USER: ${{ secrets.POMICH_SSH_USER }}
          POMICH_SSH_PORT: ${{ secrets.POMICH_SSH_PORT }}
          POMICH_SSH_PRIVATE_KEY: ${{ secrets.POMICH_SSH_PRIVATE_KEY }}
          POMICH_SSH_PASSWORD: ${{ secrets.POMICH_SSH_PASSWORD }}
          POMICH_SSH_KNOWN_HOSTS: ${{ secrets.POMICH_SSH_KNOWN_HOSTS }}
          POMICH_REMOTE_DIR: ${{ vars.POMICH_REMOTE_DIR }}
          POMICH_PUBLIC_URL: ${{ vars.POMICH_PUBLIC_URL }}
          POMICH_DEPLOY_SHA: ${{ github.sha }}
        run: bash scripts/deploy_github_actions.sh
