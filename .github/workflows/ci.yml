name: POMICH CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Check production dependency vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.lock

      - name: Run backend tests
        run: python -m pytest

      - name: Run frontend tests
        run: npm test

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UX and accessibility checks
        run: npm run test:e2e

      - name: Verify built frontend under production CSP
        run: npx playwright test --config playwright.production.config.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results/playwright
          retention-days: 7

  postgis-runtime:
    name: PostGIS runtime smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: pomich
          POSTGRES_USER: pomich
          POSTGRES_PASSWORD: pomich
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pomich -d pomich"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run PostGIS dispatch smoke
        env:
          POMICH_STORAGE_BACKEND: sql
          DATABASE_URL: postgresql+psycopg://pomich:pomich@127.0.0.1:5432/pomich
        run: python scripts/postgis_smoke.py

      - name: Run adversarial API regressions on PostgreSQL
        env:
          POMICH_AUDIT_TEST_DATABASE_URL: postgresql+psycopg://pomich:pomich@127.0.0.1:5432/pomich_audit_test
          POMICH_SKIP_LOCAL_ENV: "1"
        run: |
          python -c "import psycopg; c=psycopg.connect('postgresql://pomich:pomich@127.0.0.1:5432/pomich', autocommit=True); c.execute('CREATE DATABASE pomich_audit_test'); c.close()"
          python -m pytest tests/test_audit_regressions.py -q

      - name: Set up Node for real browser lifecycle
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Run browser with real API and PostGIS
        env:
          POMICH_E2E_DATABASE_URL: postgresql+psycopg://pomich:pomich@127.0.0.1:5432/pomich_e2e_test
          POMICH_SKIP_LOCAL_ENV: "1"
        run: |
          python -c "import psycopg; c=psycopg.connect('postgresql://pomich:pomich@127.0.0.1:5432/pomich', autocommit=True); c.execute('CREATE DATABASE pomich_e2e_test'); c.close()"
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.backend.config.ts

      - name: Verify PostGIS backup restore round trip
        env:
          PGPASSWORD: pomich
        run: |
          bash -n scripts/ops/backup_postgres.sh scripts/ops/verify_postgres_backup.sh
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
          /usr/lib/postgresql/16/bin/pg_dump -h 127.0.0.1 -U pomich -d pomich -Fc --no-owner --no-acl -f "$RUNNER_TEMP/pomich-ci.dump"
          (cd "$RUNNER_TEMP" && sha256sum pomich-ci.dump > pomich-ci.dump.sha256)
          (cd "$RUNNER_TEMP" && sha256sum --check pomich-ci.dump.sha256)
          /usr/lib/postgresql/16/bin/psql -h 127.0.0.1 -U pomich -d pomich -c 'CREATE DATABASE pomich_verify'
          /usr/lib/postgresql/16/bin/pg_restore -h 127.0.0.1 -U pomich -d pomich_verify --exit-on-error --no-owner --no-acl "$RUNNER_TEMP/pomich-ci.dump"
          test "$(/usr/lib/postgresql/16/bin/psql -h 127.0.0.1 -U pomich -d pomich_verify -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE'")" -gt 0

  container-security:
    name: Container security and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build locked non-root runtime
        run: docker build --build-arg POMICH_BUILD_SHA=${{ github.sha }} -t pomich-audit:ci .
      - name: Scan image and generate SBOM
        run: |
          mkdir -p security-reports
          scanner=aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/security-reports:/reports" "$scanner" image --format cyclonedx --output /reports/sbom.cdx.json pomich-audit:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/security-reports:/reports" "$scanner" image --scanners vuln --format json --output /reports/vulnerabilities.json --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 pomich-audit:ci
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security
          path: security-reports

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, postgis-runtime, container-security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: pomich-production
      cancel-in-progress: false

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Install password SSH fallback
        env:
          POMICH_SSH_PRIVATE_KEY: ${{ secrets.POMICH_SSH_PRIVATE_KEY }}
          POMICH_SSH_PASSWORD: ${{ secrets.POMICH_SSH_PASSWORD }}
        run: |
          if [[ -z "$POMICH_SSH_PRIVATE_KEY" && -n "$POMICH_SSH_PASSWORD" ]]; then
            sudo apt-get update
            sudo apt-get install -y sshpass
          fi

      - name: Deploy tested commit
        env:
          POMICH_SSH_HOST: ${{ secrets.POMICH_SSH_HOST }}
          POMICH_SSH_USER: ${{ secrets.POMICH_SSH_USER }}
          POMICH_SSH_PORT: ${{ secrets.POMICH_SSH_PORT }}
          POMICH_SSH_PRIVATE_KEY: ${{ secrets.POMICH_SSH_PRIVATE_KEY }}
          POMICH_SSH_PASSWORD: ${{ secrets.POMICH_SSH_PASSWORD }}
          POMICH_SSH_KNOWN_HOSTS: ${{ secrets.POMICH_SSH_KNOWN_HOSTS }}
          POMICH_REMOTE_DIR: ${{ vars.POMICH_REMOTE_DIR }}
          POMICH_PUBLIC_URL: ${{ vars.POMICH_PUBLIC_URL }}
          POMICH_DEPLOY_SHA: ${{ github.sha }}
        run: bash scripts/deploy_github_actions.sh
