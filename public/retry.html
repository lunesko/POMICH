<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta http-equiv="refresh" content="4" />
  <meta name="theme-color" content="#0B7A4D" />
  <title>POMICH · оновлення</title>
  <link rel="icon" href="/favicon-32.png" type="image/png" />
  <style>
    :root {
      --bg: #E2E9E6;
      --bg-deep: #D4E0DA;
      --ink: #1A2332;
      --muted: #4A5A68;
      --brand: #16A36A;
      --brand-deep: #0B7A4D;
      --surface: rgba(255, 255, 255, 0.72);
      --line: rgba(28, 42, 36, 0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
    }

    body {
      display: grid;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(120% 80% at 50% -10%, rgba(22, 163, 106, 0.2), transparent 55%),
        radial-gradient(90% 70% at 100% 100%, rgba(11, 122, 77, 0.12), transparent 50%),
        linear-gradient(165deg, var(--bg) 0%, var(--bg-deep) 100%);
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      width: min(100%, 360px);
      text-align: center;
      animation: rise 480ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .logo {
      width: min(168px, 48vw);
      height: auto;
      margin: 0 auto 18px;
      display: block;
      object-fit: contain;
      background: #fff;
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: 0 8px 20px rgba(11, 122, 77, 0.12);
      animation: softPulse 2.4s ease-in-out infinite;
    }

    .brand-line {
      width: 56px;
      height: 2px;
      margin: 0 auto 16px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, var(--brand), transparent);
      background-size: 200% 100%;
      animation: sheen 2.2s ease-in-out infinite;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    .lead {
      margin: 0 auto 18px;
      max-width: 32ch;
      font-size: 0.88rem;
      line-height: 1.45;
      color: var(--muted);
      font-weight: 500;
    }

    .panel {
      padding: 14px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-align: left;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--brand-deep);
    }

    .status-left {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .status-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: var(--brand);
      animation: spin 1.1s linear infinite;
    }

    .eta {
      color: var(--muted);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .track {
      height: 5px;
      border-radius: 999px;
      background: rgba(28, 42, 36, 0.1);
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 38%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--brand-deep), var(--brand), #3ecf8e);
      animation: slide 1.35s ease-in-out infinite;
    }

    .tips {
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }

    .tips li {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 8px;
      align-items: center;
      font-size: 0.8rem;
      line-height: 1.35;
      color: var(--muted);
      font-weight: 500;
    }

    .tip-icon {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: rgba(22, 163, 106, 0.12);
      color: var(--brand-deep);
      display: grid;
      place-items: center;
    }

    .tip-icon svg {
      width: 13px;
      height: 13px;
      display: block;
    }

    .actions {
      margin-top: 16px;
      display: grid;
      gap: 8px;
    }

    .reload {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 12px;
      background: var(--brand-deep);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 10px 20px rgba(11, 122, 77, 0.2);
    }

    .reload svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .note {
      margin: 0;
      font-size: 0.74rem;
      line-height: 1.4;
      color: var(--muted);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes softPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    @keyframes sheen {
      0%, 100% { background-position: 0% 50%; opacity: 0.55; }
      50% { background-position: 100% 50%; opacity: 1; }
    }

    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage, .logo, .brand-line, .bar, .status-icon { animation: none; }
    }
  </style>
</head>
<body>
  <main class="stage" role="status" aria-live="polite">
    <img
      class="logo"
      src="/pomich-logo.png"
      width="2149"
      height="732"
      alt="POMICH"
    />
    <div class="brand-line" aria-hidden="true"></div>

    <h1>Оновлюємо сервіс</h1>
    <p class="lead">Виходить нова версія. Зачекайте кілька секунд — сторінка відкриється сама.</p>

    <div class="panel">
      <div class="status">
        <span class="status-left">
          <svg class="status-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3a9 9 0 1 0 9 9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
          Йде оновлення
        </span>
        <span class="eta">~15–40 с</span>
      </div>
      <div class="track" aria-hidden="true"><div class="bar"></div></div>
      <ul class="tips">
        <li>
          <span class="tip-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5 10 17.5 19 7.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          Заявки й історія зберігаються
        </li>
        <li>
          <span class="tip-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2.2"/></svg>
          </span>
          Нічого натискати не потрібно
        </li>
        <li>
          <span class="tip-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 0 1 14.2-5M20 12a8 8 0 0 1-14.2 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M18 3.5V7h-3.5M6 20.5V17H9.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          Якщо довго — оновіть вручну
        </li>
      </ul>
    </div>

    <div class="actions">
      <a class="reload" href="/">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 12a8 8 0 0 1 14.2-5M20 12a8 8 0 0 1-14.2 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M18 3.5V7h-3.5M6 20.5V17H9.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Оновити зараз
      </a>
      <p class="note">Автооновлення кожні 4 секунди</p>
    </div>
  </main>
</body>
</html>
