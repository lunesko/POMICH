services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: pomich-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pomich}
      POSTGRES_USER: ${POSTGRES_USER:-pomich}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pomich-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pomich-app:
    build: .
    container_name: pomich-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${POMICH_ENV_FILE:-.env.production}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pomich-postgres-data:
