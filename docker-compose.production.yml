services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: pomich-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pomich}
      POSTGRES_USER: ${POSTGRES_USER:-pomich}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pomich-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pomich-app:
    image: ${POMICH_IMAGE:-pomich-app:latest}
    build:
      context: .
      args:
        POMICH_BUILD_SHA: ${POMICH_BUILD_SHA:-development}
    container_name: pomich-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${POMICH_ENV_FILE:-.env.production}
    ports:
      # Bind to loopback only — public traffic must go through nginx :443.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/internal/ready', timeout=3).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  pomich-postgres-data:
